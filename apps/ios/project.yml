# Magpie for iPhone: Magpie in the Files app (a File Provider extension, where
# the engine runs) and a small app for status and adding devices. Generate
# the Xcode project with `xcodegen` (see .github/workflows/apple.yml).
name: Magpie
options:
  bundleIdPrefix: dev.mandip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Magpie:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../shared/MagpieCore.swift
      - path: ../shared/ServiceProtocol.swift
      - path: ../shared/AppModel.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Scan the code another of your devices shows to join your Magpie.
        ITSAppUsesNonExemptEncryption: false
        # magpie1: links join this iPhone
        CFBundleURLTypes:
          - CFBundleURLName: dev.mandip.magpie.link
            CFBundleURLSchemes: [magpie1]
    entitlements:
      path: App/Magpie.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.mandip.magpie]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.mandip.magpie.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.magpie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_APP_PROFILE}
    dependencies:
      - target: MagpieFiles
  MagpieFiles:
    type: app-extension
    platform: iOS
    sources:
      - path: ../shared/FileProvider
      - path: ../shared/MagpieCore.swift
      - path: ../shared/ServiceProtocol.swift
    info:
      path: Files/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.dev.mandip.magpie
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: dev.mandip.magpie.keep
              NSExtensionFileProviderActionName: Keep Downloaded
              NSExtensionFileProviderActionActivationRule: "SUBQUERY ( fileproviderItems, $fileproviderItem, $fileproviderItem.userInfo.kept == NO ).@count > 0"
            - NSExtensionFileProviderActionIdentifier: dev.mandip.magpie.free
              NSExtensionFileProviderActionName: Remove Download
              NSExtensionFileProviderActionActivationRule: "SUBQUERY ( fileproviderItems, $fileproviderItem, $fileproviderItem.isDownloaded == YES ).@count > 0"
    entitlements:
      path: Files/MagpieFiles.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.mandip.magpie]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.mandip.magpie.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.magpie.files
        FRAMEWORK_SEARCH_PATHS: [$(SRCROOT)/../build]
        OTHER_LDFLAGS: [-framework, Mobile, -lresolv]
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_FILES_PROFILE}
    dependencies:
      - framework: ../build/Mobile.xcframework
        embed: false
  Screens:
    # Launches the app with sample data and screenshots each screen.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.magpie.screens
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Magpie
    dependencies:
      - target: Magpie
schemes:
  Magpie:
    build:
      targets:
        Magpie: all
        MagpieFiles: all
    archive:
      config: Release
  Screens:
    build:
      targets:
        Screens: [test]
    test:
      config: Debug
      targets: [Screens]
